[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mada-agent"
version = "0.1.0"
description = "Grounded multimodal emergency-protocol agent (Gemma 4 E2B via llama.cpp) served over HTTP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "chromadb>=0.5",
    "pillow>=10",
    "av>=12",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "respx", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mada_agent = ["data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
