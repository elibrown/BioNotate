services:
  app:
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/backend/app
    environment:
      # Reliable change detection across Docker Desktop bind mounts.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend/app:/app/backend/app:ro
      - ./frontend:/app/frontend:ro
      - ./data:/app/data:ro
    restart: "no"
