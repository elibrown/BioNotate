# Deploys the app to Google Cloud Run (https://bionotate.web.app) on every push to main.
# Google trusts only this repo's main branch (Workload Identity Federation), so no keys are stored here.
name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/319699732770/locations/global/workloadIdentityPools/github/providers/astro-repo
          service_account: github-deployer@bionotate.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        run: |
          gcloud run deploy astro-health \
            --project bionotate \
            --region us-central1 \
            --source . \
            --port 8000 \
            --memory 2Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 1 \
            --set-env-vars ASTROHEALTH_DB=/tmp/astrohealth.db \
            --allow-unauthenticated \
            --quiet
