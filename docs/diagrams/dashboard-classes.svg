<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">Dashboard class relationships</title>
<desc id="desc">DemoCrewRepository implements the CrewRepository interface and its list_crew method. The interface returns CrewMember objects, each containing zero or more Metric and Prediction objects.</desc>
<defs>
<marker id="triangle" viewBox="0 0 14 14" refX="13" refY="7" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1L13 7L1 13Z" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/></marker>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
<marker id="diamond" viewBox="0 0 16 12" refX="1" refY="6" markerWidth="13" markerHeight="10" orient="auto"><path d="M1 6L8 1L15 6L8 11Z" fill="#475569"/></marker>
</defs>
<rect width="1040" height="620" rx="16" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#334155">
<text x="520" y="42" text-anchor="middle" font-size="24" font-weight="bold" fill="#0f172a">Dashboard class relationships</text>
<text x="520" y="69" text-anchor="middle" font-size="14">Data access interface, demo implementation, and returned models</text>
<rect x="50" y="125" width="300" height="130" rx="10" fill="#e0f2fe" stroke="#64748b" stroke-width="1.5"/>
<text x="200.0" y="148" text-anchor="middle" font-size="13">«interface»</text>
<text x="200.0" y="173" text-anchor="middle" font-size="18" font-weight="bold">CrewRepository</text>
<path d="M50 188H350" stroke="#94a3b8"/>
<text x="68" y="215" font-size="14">+ list_crew(): list[CrewMember]</text>
<rect x="50" y="365" width="300" height="105" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="200.0" y="397" text-anchor="middle" font-size="18" font-weight="bold">DemoCrewRepository</text>
<path d="M50 412H350" stroke="#94a3b8"/>
<text x="68" y="439" font-size="14">+ list_crew(): list[CrewMember]</text>
<rect x="625" y="125" width="320" height="160" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="785.0" y="157" text-anchor="middle" font-size="18" font-weight="bold">CrewMember</text>
<path d="M625 172H945" stroke="#94a3b8"/>
<text x="643" y="199" font-size="14">id, name, role, observed_at</text>
<text x="643" y="223" font-size="14">metrics: list[Metric]</text>
<text x="643" y="247" font-size="14">predictions: list[Prediction]</text>
<rect x="470" y="420" width="245" height="125" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="592.5" y="452" text-anchor="middle" font-size="18" font-weight="bold">Metric</text>
<path d="M470 467H715" stroke="#94a3b8"/>
<text x="488" y="494" font-size="14">key, label, value, unit</text>
<text x="488" y="518" font-size="14">lower, upper, history</text>
<rect x="755" y="420" width="245" height="125" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="877.5" y="452" text-anchor="middle" font-size="18" font-weight="bold">Prediction</text>
<path d="M755 467H1000" stroke="#94a3b8"/>
<text x="773" y="494" font-size="14">id, target, score, threshold</text>
<text x="773" y="518" font-size="14">observed_at, model_version</text>
<g fill="none" stroke="#475569" stroke-width="2">
<path d="M200 365V255" stroke-dasharray="7 5" marker-end="url(#triangle)"/>
<path d="M350 190H625" marker-end="url(#arrow)"/>
<path d="M735 285V340H592V420" marker-start="url(#diamond)"/>
<path d="M835 285V340H878V420" marker-start="url(#diamond)"/>
</g>
<text x="220" y="317" font-size="14">implements</text>
<text x="488" y="175" text-anchor="middle" font-size="14">returns</text>
<text x="748" y="315" font-size="14">1</text>
<text x="848" y="315" font-size="14">1</text>
<text x="605" y="405" font-size="14">0..*</text>
<text x="891" y="405" font-size="14">0..*</text>
<text x="520" y="587" text-anchor="middle" font-size="14">Each crew member contains zero or more metrics and predictions.</text>
