<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">1. Data insertion</title><desc id="desc">Every approved numeric reading is written to production.measurements. Draft holds raw import/audit records. Graphs never query draft values. A unique dataset + source row + original metric key makes repeated imports safe. Reviewed shared_demo.db merges the common baseline at startup without overwriting local records.</desc>
