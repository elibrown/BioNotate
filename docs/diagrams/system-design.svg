<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
<title id="title">Multimodal prediction target architecture</title><desc id="desc">Target: client submits video, audio, or metrics to ingestion, which selects a processing strategy through a factory. The transformer calls the model service prediction endpoint. The service runs the selected model and will eventually persist predictions in a database.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1120" height="460" rx="16" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<text x="560" y="40" font-size="23" font-weight="bold" fill="#0f172a">Target: data → strategy → prediction</text>
<rect x="30" y="110" width="230" height="95" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="145" y="148" font-size="19" font-weight="bold" fill="#0c4a6e">Client</text>
<text x="145" y="177" font-size="14" fill="#334155">Video · audio · metrics</text>
<rect x="300" y="110" width="230" height="95" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="415" y="148" font-size="19" font-weight="bold" fill="#0c4a6e">Ingestion service</text>
<text x="415" y="177" font-size="14" fill="#334155">Receive and validate</text>
<rect x="570" y="110" width="230" height="95" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="685" y="148" font-size="19" font-weight="bold" fill="#0c4a6e">Processing factory</text>
<text x="685" y="177" font-size="14" fill="#334155">Video / audio / metrics strategy</text>
<rect x="840" y="110" width="230" height="95" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="955" y="148" font-size="19" font-weight="bold" fill="#0c4a6e">Model service</text>
<text x="955" y="177" font-size="14" fill="#334155">POST /predict</text>
<path d="M 260 158 H 300" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="92" font-size="12" fill="#475569">Data</text>
<path d="M 530 158 H 570" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="550" y="92" font-size="12" fill="#475569">Data + type</text>
<path d="M 800 158 H 840" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820" y="92" font-size="12" fill="#475569">Predict request</text>
<rect x="840" y="295" width="230" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="955" y="333" font-size="19" font-weight="bold" fill="#4c1d95">Selected model</text><text x="955" y="359" font-size="14" fill="#334155">Inference · model TBD</text>
<path d="M 930 205 V 295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/><path d="M 980 295 V 205" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="865" y="252" font-size="13" fill="#475569">Input</text><text x="1032" y="252" font-size="13" fill="#475569">Prediction</text>
<rect x="490" y="295" width="260" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2" stroke-dasharray="7 5"/><text x="620" y="333" font-size="19" font-weight="bold" fill="#78350f">Prediction database</text><text x="620" y="359" font-size="14" fill="#334155">Future · technology TBD</text>
<path d="M 875 205 V 250 H 620 V 295" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="700" y="239" font-size="13" fill="#475569">Future: persist prediction</text>
<text x="560" y="429" font-size="14" fill="#64748b">Target architecture · video processor connected; real transforms and model service are planned</text>
