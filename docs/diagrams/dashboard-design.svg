<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" role="img" aria-labelledby="title desc">
<title id="title">2. Data visualization</title><desc id="desc">All stored metric values come from production.measurements, whatever their source. Existing biology graph endpoint is a compatibility adapter that now reads measurements. The generic trends API is ready; arbitrary-metric UI wiring is separate from this backend refactor. Browser code receives API data; it never opens SQLite or reads CSV files directly.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#475569"/></marker></defs>
<rect width="1120" height="570" rx="16" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="30" y="40" font-size="24" font-weight="bold">2. Data visualization</text>
<text x="30" y="70" font-size="15" fill="#475569">All stored metric values come from production.measurements, whatever their source.</text>
<line x1="320" y1="160" x2="430" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="320" y1="280" x2="430" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
