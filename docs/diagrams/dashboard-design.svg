<text x="445" y="142" font-size="17" font-weight="bold">Dashboard repository</text>
<text x="445" y="167" font-size="14">Load crew and configured live values</text>
<text x="445" y="188" font-size="14">Evaluate configured alert rules</text>
<text x="445" y="209" font-size="14">GET /api/dashboard</text>
