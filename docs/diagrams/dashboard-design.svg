<text x="30" y="490" font-size="14" fill="#475569">Existing biology graph endpoint is a compatibility adapter that now reads measurements.</text>
<text x="30" y="515" font-size="14" fill="#475569">The generic trends API is ready; arbitrary-metric UI wiring is separate from this backend refactor.</text>
