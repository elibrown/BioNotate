services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:?Set TURSO_DATABASE_URL in .env}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:?Set TURSO_AUTH_TOKEN in .env}
      ASTROHEALTH_DB: /app/storage/astrohealth.db
    volumes:
      - uploads:/app/backend/uploads
      - database:/app/storage
    restart: unless-stopped
    init: true

volumes:
  database:
  uploads:
