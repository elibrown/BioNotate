</aside><main class="upload-page"><section aria-labelledby="manual-title">
  <div class="section-heading"><h2 id="manual-title">Add manual measurement</h2></div>
  <p class="muted">Save one metric at a time in the displayed unit. Manual readings do not change health status yet.</p>
  <form id="manual-form" class="manual-form">
    <label>Astronaut<select id="manual-astronaut" required></select></label>
    <label>Measured at (your local time)<input id="manual-time" type="datetime-local" required></label>
    <label>Metric<select id="manual-metric" required></select></label>
    <label>Value <span id="manual-unit"></span><input id="manual-value" type="number" step="any" required></label>
    <button id="manual-save" type="submit">Save measurement</button>
  </form>
  <p id="manual-status" role="status"></p>
</section></main></body></html>
