<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroHealth · Crew monitoring</title>
<link rel="stylesheet" href="/static/dashboard.css?v=crew-5">
<script src="/static/dashboard.js?v=figma-5" defer></script>
</head>
<body class="bionotate">
<aside class="sidebar" aria-label="AstroHealth navigation">
  <a class="rail-brand" href="/" aria-label="AstroHealth home" title="AstroHealth"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></a>
  <nav class="rail-nav" aria-label="Main navigation">
    <a class="rail-link " href="/" aria-label="Crew dashboard" data-tooltip="Crew dashboard" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m3 9v-2a6 6 0 0 0-2-4"/></svg></a>
    <a class="rail-link " href="/upload" aria-label="Upload video" data-tooltip="Upload video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-3v10l-6-3"/></svg></a>
  <a class="rail-link" href="/measurements" aria-label="Manual measurements" data-tooltip="Manual measurements"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6m-3 6v8m-4-4h8"/></svg></a>
    <a class="rail-link" href="/audio" aria-label="Voice recording" data-tooltip="Voice recording"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8"/></svg></a></nav>
  <a class="rail-link rail-alert" href="/#alerts-panel" aria-label="Health alerts" data-tooltip="Health alerts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg></a>
</aside>
<main>
<header class="dashboard-header"><div><h1>Bionotate</h1><h2>Dashboard</h2></div><section id="summary" class="summary" aria-label="Crew summary"></section><p id="connection" role="status">Connecting…</p></header>
<div class="section-heading crew-heading"><span>Crew overview</span><label>Show <select id="filter"><option value="all">All crew</option><option value="normal">Within range</option><option value="unknown">Check required</option><option value="alert">Needs attention</option></select></label></div>
<section id="crew" class="crew" aria-label="Crew members"></section>
<section class="alerts" id="alerts-panel"><div class="section-heading"><h2><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20.5h19L12 3.5Z"/><path d="M12 10v5m0 2.8h.01"/></svg> Status Report <small id="alert-count"></small></h2><div class="report-actions"><button id="refresh" class="refresh-action"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 10A7.8 7.8 0 0 0 5.6 7.2M4.5 4v4h4M4.5 14a7.8 7.8 0 0 0 13.9 2.8m1.1 3.2v-4h-4"/></svg> Refresh data</button><a class="video-action" href="/upload"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4.5 19.5 12 7 19.5Z"/></svg> Video analysis <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8.5 7H17v8.5"/></svg></a></div></div><div id="alerts" aria-live="polite"></div></section>
<footer><span>Demo environment · Illustrative alert limits</span><a href="/measurements">Add manual measurement ↗</a><span>Refreshes every 15 seconds</span></footer>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="section-heading"><span class="eyebrow">CREW MEMBER / DETAIL</span><button id="close">Close ×</button></div><div id="detail-content"></div></dialog>
</body></html>
